[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngx-protocol"
version = "0.1.0"
description = "NGX/0.1 reference protocol implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.setuptools]
package-dir = {"" = "implementation"}

[tool.setuptools.packages.find]
where = ["implementation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
